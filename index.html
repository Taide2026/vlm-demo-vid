<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Videos</title>
    <style>
      body {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 16px;
        font-family: system-ui, sans-serif;
        color: #222;
      }

      h1 {
        font-size: 1.5rem;
      }

      ul {
        padding-left: 20px;
        line-height: 1.35;
      }

      li {
        margin: 2px 0;
      }

      article {
        margin-top: 32px;
      }

      video {
        display: block;
        width: 100%;
        max-height: 70vh;
        background: #000;
      }

      article a {
        display: inline-block;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Videos</h1>
    <main>
      <div id="video-list" aria-live="polite">Loading…</div>
      <div id="player"></div>
    </main>

    <script>
      const listContainer = document.querySelector("#video-list");
      const playerContainer = document.querySelector("#player");

      function showVideo(path) {
        const name = path.split("/").pop();
        const url = path.split("/").map(encodeURIComponent).join("/");
        const article = document.createElement("article");
        const heading = document.createElement("h2");
        const video = document.createElement("video");
        const download = document.createElement("a");

        heading.textContent = name;
        video.controls = true;
        video.preload = "metadata";
        video.src = url;
        video.setAttribute("playsinline", "");
        download.href = url;
        download.download = name;
        download.textContent = `Download ${name}`;

        article.append(heading, video, download);
        playerContainer.replaceChildren(article);
      }

      fetch("videos.json")
        .then((response) => {
          if (!response.ok) throw new Error("Could not load the video list.");
          return response.json();
        })
        .then((videos) => {
          if (videos.length === 0) {
            listContainer.textContent = "No videos found.";
            return;
          }

          const list = document.createElement("ul");

          for (const path of videos) {
            const name = path.split("/").pop();
            const item = document.createElement("li");
            const link = document.createElement("a");

            link.href = "#player";
            link.textContent = name;
            link.addEventListener("click", () => showVideo(path));
            item.append(link);
            list.append(item);
          }

          listContainer.replaceChildren(list);
        })
        .catch((error) => {
          listContainer.textContent = error.message;
        });
    </script>
  </body>
</html>
